 if(type==="chair"){box(g,.8,.14,.8,wood,0,.75,0);box(g,.8,.65,.13,cm,0,1.08,-.32);for(const x of [-.3,.3])for(const z of [-.3,.3])box(g,.12,.72,.12,wood,x,.36,z)}

 else if(type==="plant"){cylinder(g,.28,.34,.42,mat(0xb77955),0,.21,0);const leaf=mat(0x4e9b72);for(let i=0;i<5;i++){const l=sphere(g,.18,leaf,Math.cos(i*1.25)*.18,.55+i*.15,Math.sin(i*1.25)*.18);l.scale.set(.7,1.8,.7)}}
 else if(type==="crate"){box(g,.8,.8,.8,cm,0,.4,0);box(g,.84,.08,.08,wood,0,.4,.42);box(g,.08,.84,.08,wood,0,.4,.42)}
 else {const m=new THREE.Mesh(new THREE.OctahedronGeometry(.65,0),new THREE.MeshStandardMaterial({color,roughness:.25,metalness:.25,emissive:color,emissiveIntensity:.12}));m.position.y=.7;g.add(m);const ring=new THREE.Mesh(new THREE.TorusGeometry(.8,.035,8,28),mat(0xb7ead8,.25,.3));ring.rotation.x=Math.PI/2;ring.position.y=.5;g.add(ring)}

  if(!insidePlot(it.x||0,it.z||0)){toast("先にマイ土地へ配置してください");return}
  const [dx,dz]=b.dataset.shift.split(",").map(Number);
  if(!insidePlot(it.x+dx,it.z+dz)){toast("土地の外には移動できません");return}
  it.x+=dx;it.z+=dz;it.placed=true;syncItemMesh(it);save();toast("位置を保存しました");
 });
 $("#toggleItem").onclick=()=>{it.placed=!it.placed;syncItemMesh(it);save();editItem(id)};
 $("#deleteItem").onclick=()=>{
  if(!confirm("この作品を削除しますか？"))return;
  const idx=createdMeshes.findIndex(e=>e.id===id);
  if(idx>=0){scene.remove(createdMeshes[idx].mesh);createdMeshes.splice(idx,1)}
  state.items=state.items.filter(x=>x.id!==id);save();plotItemsPanel();toast("作品を削除しました");
 };
 $("#backItems").onclick=plotItemsPanel;
}

// NOVA 0.7: portable local backups; no login, cloud or server storage.
function backupData(){
 return {format:"nova-world-save",version:1,exportedAt:new Date().toISOString(),
  data:{credits:state.credits,items:state.items,sold:state.sold,memories:state.memories,
        missions:state.missions,visited:state.visited,plot:state.plot}};
}
function validateBackup(b){
 if(!b||b.format!=="nova-world-save"||b.version!==1||!b.data||typeof b.data!=="object")throw Error("NOVA WORLDのバックアップ形式ではありません");
 const d=b.data;
 if(!Array.isArray(d.items)||d.items.length>300||!Number.isFinite(d.credits)||d.credits<0||d.credits>1e8)throw Error("データ形式または容量が不正です");
 for(const it of d.items){
  if(!it||typeof it.id!=="string"||it.id.length>100||typeof it.name!=="string"||it.name.length>120||typeof it.type!=="string"||it.type.length>60)throw Error("作品データが不正です");
  if(!Number.isFinite(it.x||0)||!Number.isFinite(it.z||0)||Math.abs(it.x||0)>100||Math.abs(it.z||0)>100)throw Error("作品の位置が不正です");
 }
 for(const k of ["sold","memories","missions","visited"]){
  if(d[k]===null||typeof d[k]!=="object")throw Error("保存データが不正です");
 }
 return d;
}
function backupPanel(){
 let html='<h2>☁ 世界データの保存と復元</h2><p>作品・NOVA・ミッション・住人との会話記録をJSONファイルに保存できます。別の端末へ移す際に利用できます。</p>';
 html+='<button class="primary" id="exportBackup" style="width:100%">バックアップをダウンロード</button><button id="importBackup" style="width:100%;margin-top:8px">バックアップを読み込む</button><input type="file" id="backupFile" accept=".json,application/json" style="display:none"><p class="small">※ 読み込みは現在の端末データを上書きします。先にバックアップを取ってください。会話記録には個人的な内容が含まれる場合があります。ファイルは公開しないでください。</p><p class="small">0.7ではクラウド同期・ユーザー登録・他人への公開はまだ実装していません。</p><button id="closeBackup" style="width:100%">閉じる</button>';
 openDrawer(html);
 $("#exportBackup").onclick=()=>{
  const blob=new Blob([JSON.stringify(backupData(),null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="nova-world-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast("バックアップを保存しました");
 };
 $("#importBackup").onclick=()=>$("#backupFile").click();
 $("#backupFile").onchange=async e=>{
  const f=e.target.files?.[0];if(!f)return;
  if(f.size>2*1024*1024){toast("ファイルが大きすぎます（上限2MB）");return}
  try{
   const d=validateBackup(JSON.parse(await f.text()));
   if(!confirm("現在の作品・NOVA・会話記録をバックアップの内容で上書きします。続けますか？"))return;
   const payload={credits:d.credits,items:d.items,sold:d.sold||[],memories:d.memories||{},missions:d.missions||{},visited:d.visited||{},plot:d.plot||{x:43,z:43}};
   localStorage.setItem("nova-world-save",JSON.stringify(payload));
   alert("復元しました。画面を再読み込みします。");location.reload();
  }catch(err){alert("読み込みできませんでした："+err.message)}
 };
 $("#closeBackup").onclick=closeDrawer;
}

// Touch joystick
const stick=$("#stick"),nub=$("#nub");let stickRect=null;
function stickMove(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=34,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}nub.style.left=(34+dx)+"px";nub.style.top=(34+dy)+"px";state.moveX=dx/max;state.moveY=dy/max}
stick.addEventListener("pointerdown",e=>{stick.setPointerCapture(e.pointerId);stickMove(e)});
stick.addEventListener("pointermove",e=>{if(e.buttons||e.pressure>0)stickMove(e)});
function resetStick(){nub.style.left="34px";nub.style.top="34px";state.moveX=0;state.moveY=0}
stick.addEventListener("pointerup",resetStick);stick.addEventListener("pointercancel",resetStick);
// Drag screen to rotate camera
renderer.domElement.addEventListener("pointerdown",e=>{if(e.clientX<140&&e.clientY>innerHeight-160)return;state.dragging=true;state.lastX=e.clientX;state.lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener("pointermove",e=>{if(!state.dragging)return;const dx=e.clientX-state.lastX;state.lastX=e.clientX;state.lastY=e.clientY;state.yaw-=dx*.006;});
renderer.domElement.addEventListener("pointerup",()=>state.dragging=false);renderer.domElement.addEventListener("pointercancel",()=>state.dragging=false);
const keys={};addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true});addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;
 let x=state.moveX,z=state.moveY;
 if(keys.w||keys.arrowup)z=-1;if(keys.s||keys.arrowdown)z=1;if(keys.a||keys.arrowleft)x=-1;if(keys.d||keys.arrowright)x=1;
 const len=Math.hypot(x,z);if(len>1){x/=len;z/=len}
 const speed=5.2;
 if(len>.08){const dx=(x*Math.cos(state.yaw)+z*Math.sin(state.yaw))*speed*dt;const dz=(-x*Math.sin(state.yaw)+z*Math.cos(state.yaw))*speed*dt;player.position.x+=dx;player.position.z+=dz;player.rotation.y=Math.atan2(dx,dz)}
 player.position.x=THREE.MathUtils.clamp(player.position.x,-58,58);player.position.z=THREE.MathUtils.clamp(player.position.z,-58,58);
 const px=player.position.x,pz=player.position.z;
 const zone=insidePlot(px,pz)?"⌂ MY PLOT · マイ土地":Math.abs(px)<6||Math.abs(pz)<6?"◉ NOVA CENTRAL · 中央広場":(px>0?(pz<0?"◈ NOVA CENTRAL · 近未来都市":"◇ CREATOR STREET · 商業地区"):(pz<0?"❋ GREEN FRONTIER · 自然地区":"⌂ LIFE DISTRICT · 住宅地区"));
 if(zone!==state.currentZone){state.currentZone=zone;$("#district").textContent=zone;const area=px>6?(pz< -6?"future":pz>6?"commerce":"central"):px< -6?(pz< -6?"nature":pz>6?"residential":"central"):"central";missionEvent("visit",area)}
 const targetYaw=state.yaw;const camDist=7.2,camHeight=4.1;
 const desired=new THREE.Vector3(player.position.x-Math.sin(targetYaw)*camDist,player.position.y+camHeight,player.position.z-Math.cos(targetYaw)*camDist);
 camera.position.lerp(desired,.09);camera.lookAt(player.position.x,1.2,player.position.z);
 for(const n of npcs){
  n.halo.rotation.z+=dt*.4;
  const t=(now-societyStart)*.00011+n.phase;
  const phase=(Math.floor(t/1.5)%3);
  n.activity=["仕事中","散歩中","休憩中"][phase];
  const r=phase===1?2.4:phase===2?.65:1.1;
  n.group.position.x=n.homeX+Math.cos(t*2.1)*r;
  n.group.position.z=n.homeZ+Math.sin(t*2.1)*r;
  n.group.lookAt(player.position.x,0,player.position.z);
 }
 for(let i=0;i<ripples.length;i++){const p=((now*.00035+i/3)%1);ripples[i].scale.setScalar(.65+p*2.4);ripples[i].material.opacity=.6*(1-p)}
 for(let i=0;i<clouds.length;i++)clouds[i].position.x+=dt*.11;
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
save();
</script>
